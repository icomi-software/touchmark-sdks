name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Generated types match the OpenAPI snapshot
        # git status also fails on a new file the generator adds.
        run: |
          npm run generate
          git diff --exit-code -- src/gen
          test -z "$(git status --porcelain -- src/gen)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: The packed package installs, imports and type-checks
        run: bash scripts/pack-check.sh

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Generated models match the OpenAPI snapshot
        run: |
          cd .. && bash scripts/generate.sh python
          git diff --exit-code -- python/touchmark/_gen
          test -z "$(git status --porcelain -- python/touchmark/_gen)"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: The built wheel installs and imports
        run: bash scripts/build-check.sh

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.20", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Generated types match the OpenAPI snapshot
        run: |
          cd .. && bash scripts/generate.sh go
          git diff --exit-code -- go/types.gen.go
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
